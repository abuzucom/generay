apiVersion: batch/v1
kind: CronJob
metadata:
  name: payroll-close
spec:
  schedule: "0 18 * * 5"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: close
              image: registry.example/payroll:1.4.2
              env:
                - name: TZ
                  value: "EST5"
